<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Little Library</title>
  
  <!-- Google Fonts: Playfair Display for headings, Plus Jakarta Sans for UI -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <!-- Cozy Dark-Wood Header Banner -->
    <header class="app-header">
      <div class="header-badge">
        <svg class="book-icon" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5Z"/>
          <path d="M6 6h10"/>
          <path d="M6 10h10"/>
          <path d="M6 14h6"/>
        </svg>
      </div>
      <h1 class="header-title">My Little Library</h1>
      <p class="header-quote">
        <span class="quote-text">“A reader lives a thousand lives before he dies.”</span>
        <span class="quote-author">George R.R. Martin, A Dance with Dragons</span>
      </p>
    </header>

    <!-- Main Layout: Single column on phone/tablet, 2-column on desktop -->
    <div class="main-layout">
      <!-- Left Column: Add Book Form -->
      <section class="form-section index-card">
        <div class="index-card-banner">
          <span class="index-card-title">LIBRARY CATALOG CARD</span>
        </div>

        <form id="book-form" novalidate>
          <!-- Title input group -->
          <div class="form-group">
            <label for="title-input">Book Title</label>
            <input 
              type="text" 
              id="title-input" 
              placeholder="e.g. The Shadow of the Wind"
              autocomplete="off"
            >
            <p class="error-message" id="title-error"></p>
          </div>

          <!-- Author input group -->
          <div class="form-group">
            <label for="author-input">Author</label>
            <input 
              type="text" 
              id="author-input" 
              placeholder="e.g. Carlos Ruiz Zafón"
              autocomplete="off"
            >
            <p class="error-message" id="author-error"></p>
          </div>

          <!-- Status selection group -->
          <div class="form-group">
            <label for="status-select">Reading Status</label>
            <select id="status-select">
              <option value="To read">To read</option>
              <option value="Reading">Reading</option>
              <option value="Finished">Finished</option>
            </select>
          </div>

          <button type="submit" id="submit-btn" class="btn-primary">
            <span class="btn-text">Add Book</span>
            <span class="btn-arrow" aria-hidden="true">&plus;</span>
          </button>
        </form>
      </section>

      <!-- Right Column: Bookshelf and Reading Stats -->
      <section class="list-section bookshelf">
        <div class="shelf-header">
          <h2 class="section-title">My Bookshelf</h2>
        </div>

        <!-- Stat tiles container -->
        <div id="status-counts" class="stats-grid" aria-live="polite"></div>

        <!-- Search box -->
        <div class="search-group">
          <label for="search-input" class="visually-hidden">Search books</label>
          <div class="search-wrapper">
            <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="11" cy="11" r="8"></circle>
              <path d="m21 21-4.3-4.3"></path>
            </svg>
            <input 
              type="search" 
              id="search-input" 
              placeholder="Search your collection by title or author..."
              autocomplete="off"
            >
          </div>
        </div>

        <!-- Empty state message -->
        <div id="empty-state" class="empty-state">
          <div class="empty-icon" aria-hidden="true">📖</div>
          <p class="empty-message">Your shelf is empty. Add your first book!</p>
        </div>

        <!-- Book list -->
        <ul id="book-list" class="book-list" aria-live="polite"></ul>
      </section>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
